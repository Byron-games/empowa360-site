<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks — Empowa360</title>
<meta name="description" content="Track development tasks, owners, priorities and delivery milestones.">
<meta property="og:title" content="Tasks — Empowa360">
<meta property="og:description" content="Track development tasks, owners, priorities and delivery milestones.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="tasks">
<main class="main"><div class="page">
  <div class="page-head"><div><h1>Task Management</h1><p class="sub">Track development tasks and delivery milestones</p></div><div class="head-actions"><button class="btn btn-primary" id="addBtn"><span id="pIc"></span>Add Task</button></div></div>
  <section id="stats"></section>
  <section class="card" id="tbl">
    <div class="filters"><div class="search-field"><span id="sIc"></span><input class="input" id="q" type="search" placeholder="Search tasks…" aria-label="Search tasks" style="width:240px;height:36px"></div>
      <select class="select" id="fStatus" aria-label="Status" style="width:auto;height:36px"><option value="">All statuses</option><option>To Do</option><option>In Progress</option><option>Review</option><option>Done</option></select>
      <select class="select" id="fPrio" aria-label="Priority" style="width:auto;height:36px"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select>
      <span class="muted" style="margin-left:auto;font-size:13px">Tip: click a status to advance it</span></div>
    <div class="table-wrap"><table><thead></thead><tbody></tbody></table></div><div class="table-foot"><span class="info"></span><div class="pager"></div></div></section>
</div></main>
<script src="js/app.js"></script><script src="js/data.js"></script>
<script>

const { $, icon, esc, stats, fmtDate } = E;
$('#sIc').innerHTML = icon('search', 16); $('#pIc').innerHTML = icon('plus', 16);
const PRIO = { High:'red', Medium:'amber', Low:'green' }, ST = { 'To Do':'gray', 'In Progress':'blue', Review:'purple', Done:'green' }, FLOW = ['To Do','In Progress','Review','Done'];
const today = new Date(); today.setHours(0,0,0,0);
const late = r => r.status !== 'Done' && new Date(r.due + 'T00:00:00') < today;
let first = true;
function paint(all) {
  const n = k => all.filter(r => r.status === k).length, o = all.filter(late).length;
  stats('#stats', [
    { label:'Total Tasks', icon:'check', ...(first ? { count:all.length } : { text:all.length }), delta:'+12.5%' },
    { label:'In Progress', icon:'trend', tone:'', ...(first ? { count:n('In Progress') } : { text:n('In Progress') }), delta:'+4.3%' },
    { label:'Completed', icon:'check', tone:'green', ...(first ? { count:n('Done') } : { text:n('Done') }), delta:'+8.1%' },
    { label:'Overdue', icon:'check', tone:'red', ...(first ? { count:o } : { text:o }), delta:'−1.2%', dir:'down' }]); first = false;
}
const t = E.table({ el:'#tbl', data:D.tasks(), label:'tasks', pager:'simple', search:'#q', text:r => [r.name,r.project,r.assignee].join(' '),
  cols:[
    { label:'Task name', key:'name', sort:true, render:r => `<b>${esc(r.name)}</b>` }, { label:'Project', key:'project', sort:true }, { label:'Assignee', key:'assignee', sort:true, render:r => `<b>${esc(r.assignee === 'Elizabeth Mercer' ? 'Elizabeth M.' : r.assignee)}</b>` },
    { label:'Priority', key:'priority', sort:r => ({ High:0, Medium:1, Low:2 }[r.priority]), render:r => `<span class="pill ${PRIO[r.priority]} nodot">${r.priority}</span>` },
    { label:'Status', key:'status', sort:true, render:r => `<button class="pill ${ST[r.status]}" data-adv="${r.id}" style="border:0;cursor:pointer" title="Click to advance status">${r.status}</button>` },
    { label:'Due date', key:'due', sort:true, render:r => `<span style="${late(r) ? 'color:var(--red);font-weight:600' : ''}">${fmtDate(r.due)}${late(r) ? ' · overdue' : ''}</span>` }],
  onRender() { paint(t.all); } });
function pred() { const s = $('#fStatus').value, p = $('#fPrio').value; t.setPred(r => (!s || r.status === s) && (!p || r.priority === p)); }
$('#fStatus').addEventListener('change', pred); $('#fPrio').addEventListener('change', pred);
$('#addBtn').addEventListener('click', () => F.task(it => t.setData([it, ...t.all])));
$('#tbl').addEventListener('click', e => { const b = e.target.closest('[data-adv]'); if (!b) return; const r = t.all.find(x => x.id === b.dataset.adv); r.status = FLOW[(FLOW.indexOf(r.status) + 1) % 4]; t.refresh(); if (r.status === 'Done') E.toast(`“${r.name}” completed`, 'ok'); });

</script>
</body>
</html>
