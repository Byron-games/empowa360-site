<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — Empowa360</title>
<meta name="description" content="Monitor delivery progress, team assignments and client milestones.">
<meta property="og:title" content="Projects — Empowa360">
<meta property="og:description" content="Monitor delivery progress, team assignments and client milestones.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="projects">
<main class="main"><div class="page">
  <div class="page-head"><div><h1>Client Projects</h1><p class="sub">Monitor delivery progression and client milestones</p></div><div class="head-actions"><button class="btn btn-primary" id="addBtn"><span id="pIc"></span>New Project</button></div></div>
  <section id="stats"></section>
  <div class="seg" id="seg" role="group" aria-label="Filter projects" style="margin-bottom:16px"><button class="on" data-s="">All</button><button data-s="Active">Active</button><button data-s="On Hold">On Hold</button><button data-s="Overdue">Overdue</button><button data-s="Completed">Completed</button></div>
  <div class="grid-3" id="grid"></div>
</div></main>
<script src="js/app.js"></script><script src="js/data.js"></script>
<script>

const { $, icon, esc, stats, fmtDate } = E;
$('#pIc').innerHTML = icon('plus', 16);
stats('#stats', [
  { label:'Active Projects', icon:'folder', count:12, delta:'+2 active', note:'vs last month' },
  { label:'Completed', icon:'check', tone:'green', count:45, delta:'+5 this week', note:'vs last month' },
  { label:'Overdue Projects', icon:'trend', tone:'red', count:2, delta:'−1 corrected', note:'vs last month' },
  { label:'Team Members', icon:'users', tone:'purple', count:18, delta:'Full load', dir:'up', note:'vs last month' }]);
const TX = { Active:'var(--primary)', Completed:'var(--green)', 'On Hold':'var(--amber)', Overdue:'var(--red)' };
let filter = '';
function draw() {
  const list = D.projects().filter(p => !filter || p.status === filter);
  $('#grid').innerHTML = list.length ? list.map((p, i) => `<article class="card proj fade-in" style="animation-delay:${i * 40}ms"><div class="proj-top"><span>${esc(p.client)}</span><span style="color:${TX[p.status]}">${p.status}</span></div><h3>${esc(p.name)}</h3>
    <div><div class="bar"><i data-w="${p.progress}" class="${p.status === 'Completed' ? 'green' : p.status === 'Overdue' ? 'red' : p.status === 'On Hold' ? 'amber' : ''}"></i></div><div class="proj-meta" style="margin-top:6px"><span>Progress</span><b>${p.progress}%</b></div></div>
    <div class="proj-foot"><div class="avatars">${p.team.map(n => E.avatar(n, 28)).join('')}</div><span>${icon('calendar', 14)}${fmtDate(p.due)}</span></div></article>`).join('') : '<div class="card empty" style="grid-column:1/-1">No projects with this status.</div>';
  E.bars($('#grid'));
}
draw();
$('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.s; E.$$('#seg button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
$('#addBtn').addEventListener('click', () => F.project(draw));

</script>
</body>
</html>
