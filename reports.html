<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports & Analytics — Empowa360</title>
<meta name="description" content="Pipeline conversion, regional sales and lead source insights with downloadable reports.">
<meta property="og:title" content="Reports & Analytics — Empowa360">
<meta property="og:description" content="Pipeline conversion, regional sales and lead source insights with downloadable reports.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="reports">
<main class="main"><div class="page">
  <div class="page-head"><div><h1>Reports &amp; Analytics</h1><p class="sub">Trace real-time insights, metrics and pipeline conversion performance</p></div><div class="head-actions"><button class="btn btn-primary" id="addBtn"><span id="pIc"></span>Generate Report</button></div></div>
  <section id="stats"></section>
  <div class="grid-2 split" style="margin-bottom:24px">
    <section class="card card-pad"><div class="card-head"><div><h2>Sales by Region</h2><p>Regional contribution to total pipeline value</p></div></div><div class="chart-box"><canvas id="reg" role="img" aria-label="Bar chart of pipeline value by region"></canvas></div></section>
    <section class="card card-pad"><div class="card-head"><div><h2>Lead Sources Distribution</h2><p>Acquisition channel performance metrics</p></div></div>
      <div class="donut-wrap"><div class="donut-box"><canvas id="src" role="img" aria-label="Doughnut chart of lead sources"></canvas><div class="donut-center"><b>1,847</b><span>Leads</span></div></div><ul class="donut-legend" id="srcLg"></ul></div></section>
  </div>
  <section class="card" id="tbl"><div class="table-wrap"><table><thead></thead><tbody></tbody></table></div><div class="table-foot"><span class="info"></span><div class="pager"></div></div></section>
</div></main>
<script src="js/chart.umd.min.js"></script><script src="js/app.js"></script><script src="js/data.js"></script>
<script>

const { $, icon, esc, stats, fmtDate } = E;
$('#pIc').innerHTML = icon('plus', 16);
stats('#stats', [
  { label:'Total Reports', icon:'file', count:142, delta:'+12.3%' },
  { label:'Scheduled', icon:'calendar', tone:'purple', count:18, delta:'+4.5%' },
  { label:'Revenue Growth', icon:'trend', tone:'green', count:24.3, prefix:'+', suffix:'%', decimals:1, delta:'+18.4%' },
  { label:'Customer Satisfaction', icon:'users', tone:'amber', count:94.2, suffix:'%', decimals:1, delta:'+2.1%' }]);
E.chart('#reg', c => ({ type:'bar', data:{ labels:['N. America','Europe','Asia Pacific','LatAm','MEA'], datasets:[{ data:[4.2,3.1,2.4,1.5,1.0], backgroundColor:c.primary, borderRadius:6, maxBarThickness:64 }] },
  options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:x => ` $${x.parsed.y}M pipeline` } } }, scales:{ x:{ grid:{ display:false }, border:{ display:false } }, y:{ grid:{ color:c.grid }, border:{ display:false }, ticks:{ callback:v => '$' + v + 'M' } } } } }));
const SRC = [['LinkedIn',35,'primary'],['Referral',25,'purple'],['Website',20,'green'],['Direct',12,'amber'],['Cold Call',8,'gray']];
E.chart('#src', c => ({ type:'doughnut', data:{ labels:SRC.map(s => s[0]), datasets:[{ data:SRC.map(s => s[1]), backgroundColor:SRC.map(s => c[s[2]]), borderColor:c.surface, borderWidth:3, hoverOffset:4 }] },
  options:{ responsive:true, maintainAspectRatio:false, cutout:'72%', plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:x => ` ${x.label}: ${x.parsed}%` } } } } }));
const paintLg = () => { const c = E.colors(); $('#srcLg').innerHTML = SRC.map(s => `<li><i style="background:${c[s[2]]}"></i>${s[0]}<b>${s[1]}%</b></li>`).join(''); }; paintLg(); window.addEventListener('themechange', paintLg);
const TONE = { Ready:'green', Processing:'amber', Scheduled:'purple' };
const t = E.table({ el:'#tbl', data:D.reports(), label:'reports', pager:'simple', pageSize:6, search:null,
  cols:[
    { label:'Report name', key:'name', sort:true, render:r => `<b>${esc(r.name)}</b>` }, { label:'Type', key:'type', sort:true }, { label:'Generated by', key:'by', sort:true, render:r => `<b>${esc(r.by)}</b>` },
    { label:'Date', key:'date', sort:true, render:r => fmtDate(r.date) }, { label:'Status', key:'status', sort:true, render:r => `<span class="pill ${TONE[r.status]}">${r.status}</span>` },
    { label:'Action', cls:'num', render:r => r.status === 'Ready' ? `<button class="btn btn-primary btn-sm" data-dl="${r.id}">${icon('download', 14)}Download</button>` : `<button class="btn btn-ghost btn-sm" disabled>${r.status}…</button>` }] });
$('#tbl').addEventListener('click', async e => { const b = e.target.closest('[data-dl]'); if (!b) return; const r = t.all.find(x => x.id === b.dataset.dl); await E.busy(b, 700);
  E.download(r.name.replace(/\W+/g, '-').toLowerCase() + '.csv', E.csv([['Report','Type','Generated by','Date'], [r.name,r.type,r.by,r.date], [], ['Region','Pipeline value (USD M)'], ['N. America',4.2],['Europe',3.1],['Asia Pacific',2.4],['LatAm',1.5],['MEA',1.0]])); E.toast('Report downloaded', 'ok'); });
$('#addBtn').addEventListener('click', () => F.report(it => { t.setData([it, ...t.all]); if (it.status === 'Processing') setTimeout(() => { it.status = 'Ready'; t.refresh(); E.toast(`“${it.name}” is ready to download`, 'ok'); }, 3500); }));

</script>
</body>
</html>
