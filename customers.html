<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers — Empowa360</title>
<meta name="description" content="Manage client relationships, activity and communication across 1,248 customers.">
<meta property="og:title" content="Customers — Empowa360">
<meta property="og:description" content="Manage client relationships, activity and communication across 1,248 customers.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="customers">
<main class="main"><div class="page">
  <div class="page-head"><div><h1>Customers</h1><p class="sub">Manage your organization’s client relationships, activities, and communication.</p></div>
    <div class="head-actions">
      <div class="search-field"><span id="sIc"></span><input class="input" id="q" type="search" placeholder="Search customers…" aria-label="Search customers" style="width:240px"></div>
      <button class="btn btn-outline" id="filtBtn" aria-expanded="false"><span id="fIc"></span>Filters</button>
      <button class="btn btn-primary" id="addBtn"><span id="pIc"></span>Add Customer</button>
    </div></div>
  <section id="stats"></section>
  <div id="bulk" class="card card-pad" hidden style="margin-bottom:16px;padding:12px 20px;display:none;align-items:center;gap:16px"><b id="bulkN"></b><span class="muted">selected</span><span style="margin-left:auto;display:flex;gap:8px"><button class="btn btn-outline btn-sm" id="bulkExp">Export CSV</button><button class="btn btn-ghost btn-sm" id="bulkClr">Clear</button></span></div>
  <section class="card" id="tbl"><div class="more-filters" id="more" style="padding-top:16px"><div class="field"><label for="fStatus">Status</label><select class="select" id="fStatus"><option value="">All statuses</option><option>Active</option><option>Inactive</option></select></div></div><div class="table-wrap"><table><thead></thead><tbody></tbody></table></div><div class="table-foot"><span class="info"></span><div class="pager"></div></div></section>
</div></main>
<script src="js/app.js"></script><script src="js/data.js"></script>
<script>

const { $, icon, esc, stats, avatar } = E;
$('#sIc').innerHTML = icon('search', 16); $('#fIc').innerHTML = icon('sliders', 16); $('#pIc').innerHTML = icon('plus', 16);
stats('#stats', [
  { label:'Total Customers', icon:'users', count:1248, delta:'+12%' },
  { label:'Active', icon:'usercheck', tone:'green', count:986, delta:'+8.4%' },
  { label:'Inactive', icon:'userminus', tone:'red', count:262, delta:'−2.1%', dir:'down' },
  { label:'New This Month', icon:'userplus', tone:'purple', count:47, delta:'+18.3%' }]);
const sel = new Set();
const t = E.table({ el:'#tbl', data:D.customers(), label:'customers', pager:'numbers', search:'#q', text:r => [r.name,r.company,r.email,r.phone].join(' '),
  cols:[
    { label:'<input type="checkbox" class="check" id="all" aria-label="Select all on page">', render:r => `<input type="checkbox" class="check" data-id="${r.id}" aria-label="Select ${esc(r.name)}" ${sel.has(r.id) ? 'checked' : ''}>` },
    { label:'Customer name', key:'name', sort:true, render:r => `<span class="cell-user">${avatar(r.name, 36)}${esc(r.name)}</span>` },
    { label:'Company', key:'company', sort:true }, { label:'Email', key:'email', sort:true }, { label:'Phone', key:'phone' },
    { label:'Status', key:'status', sort:true, render:r => `<span class="pill ${r.status === 'Active' ? 'green' : 'gray'}">${r.status}</span>` },
    { label:'Last activity', key:'last' },
    { label:'', cls:'num', render:r => `<button class="icon-btn" data-more="${r.id}" aria-label="Actions for ${esc(r.name)}">${icon('more', 18)}</button>` }],
  onRender(rows) { const all = $('#all'); if (all) all.checked = rows.length > 0 && rows.every(r => sel.has(r.id)); }
});
function bulk() { const b = $('#bulk'); b.style.display = sel.size ? 'flex' : 'none'; $('#bulkN').textContent = sel.size; }
$('#tbl').addEventListener('change', e => {
  if (e.target.id === 'all') { t.rows.slice(0, 8).length; $('tbody').querySelectorAll('[data-id]').forEach(c => { c.checked = e.target.checked; e.target.checked ? sel.add(c.dataset.id) : sel.delete(c.dataset.id); }); }
  else if (e.target.dataset.id) { e.target.checked ? sel.add(e.target.dataset.id) : sel.delete(e.target.dataset.id); const all = $('#all'); all.checked = [...$('tbody').querySelectorAll('[data-id]')].every(c => c.checked); }
  bulk();
});
$('#bulkClr').addEventListener('click', () => { sel.clear(); bulk(); t.refresh(); });
$('#bulkExp').addEventListener('click', () => { const rows = t.all.filter(r => sel.has(r.id)); E.download('customers-selected.csv', E.csv([['Name','Company','Email','Phone','Status'], ...rows.map(r => [r.name,r.company,r.email,r.phone,r.status])])); E.toast(`Exported ${rows.length} customers`, 'ok'); });
$('#filtBtn').addEventListener('click', e => { const o = $('#more').classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', o); });
$('#fStatus').addEventListener('change', e => t.setPred(e.target.value ? r => r.status === e.target.value : null));
$('#addBtn').addEventListener('click', () => F.customer(it => t.setData([it, ...t.all])));
$('#tbl').addEventListener('click', e => { const b = e.target.closest('[data-more]'); if (!b) return; const r = t.all.find(x => x.id === b.dataset.more);
  E.modal({ title:r.name, sub:r.company, cancel:'Close', submit:false, html:`<dl class="dl"><dt>Email</dt><dd>${esc(r.email)}</dd><dt>Phone</dt><dd>${esc(r.phone)}</dd><dt>Status</dt><dd>${r.status}</dd><dt>Last activity</dt><dd>${esc(r.last)}</dd></dl><div class="modal-foot" style="padding-top:0"><a class="btn btn-primary" href="mailto:${esc(r.email)}">Send email</a></div>` }); });

</script>
</body>
</html>
