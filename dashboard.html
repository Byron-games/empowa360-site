<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Empowa360</title>
<meta name="description" content="Sales performance, customer growth, upcoming tasks and revenue trends in one workspace.">
<meta property="og:title" content="Dashboard — Empowa360">
<meta property="og:description" content="Sales performance, customer growth, upcoming tasks and revenue trends in one workspace.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="dashboard">
<main class="main"><div class="page">
  <div class="page-head">
    <div><h1>Welcome back, Elizabeth</h1><p class="sub">Here's a snapshot of your sales performance and customer pipelines today.</p></div>
    <div class="head-actions">
      <label class="sr" for="range">Date range</label>
      <select class="select" id="range" style="width:auto"><option value="7">Last 7 Days</option><option value="30" selected>Last 30 Days</option><option value="90">Last 90 Days</option></select>
      <button class="btn btn-primary" id="exportBtn"><span id="expIc"></span>Export Report</button>
    </div>
  </div>
  <section id="stats" aria-label="Key metrics"></section>
  <div class="grid-2 split">
    <section class="card card-pad fill"><div class="card-head"><div><h2>Monthly Customer Growth</h2><p>New user acquisitions (last 6 months)</p></div></div><div class="chart-box"><canvas id="growth" role="img" aria-label="Bar chart of new customers per month"></canvas></div></section>
    <section class="card card-pad"><div class="card-head"><div><h2>Upcoming Tasks</h2><p>Your next deliverables</p></div><a class="link" href="tasks.html">View all</a></div><div id="tasks"></div></section>
  </div>
  <section class="card card-pad" style="margin-bottom:24px">
    <div class="card-head"><div><h2>Monthly Revenue Trend</h2><p>Historical record of sales invoice totals</p></div>
      <div class="legend" id="rlegend"><button data-i="0"><i style="background:var(--primary)"></i>Current Year</button><button data-i="1"><i style="background:#9CA3AF"></i>Previous Year</button></div></div>
    <div class="chart-box" style="height:300px"><canvas id="rev" role="img" aria-label="Line chart of monthly revenue, current versus previous year"></canvas></div>
  </section>
  <h2 class="lbl" style="margin-bottom:12px">Quick Actions</h2>
  <div class="quick" id="quick"></div>
</div></main>
<script src="js/chart.umd.min.js"></script><script src="js/app.js"></script><script src="js/data.js"></script>
<script>

const { $, $$, icon, stats, chart, esc } = E;
$('#expIc').innerHTML = icon('download', 16);
const RANGES = {
  7:  { note:'vs last week',    s:[['2,847',2847,'+3.2%'],['342',342,'+1.9%'],[0.31,0.31,'+4.1%'],[67,67,'−0.8%'],[12,12,'0.0%'],[8,8,'+1.1%']] },
  30: { note:'vs last month',   s:[['',2847,'+12.4%'],['',342,'+8.2%'],[0,1.2,'+15.3%'],['',67,'−2.1%'],['',12,'0.0%'],['',8,'+4.3%']] },
  90: { note:'vs last quarter', s:[['',2847,'+31.6%'],['',342,'+19.4%'],[0,3.4,'+22.8%'],['',67,'−5.6%'],['',12,'0.0%'],['',8,'+9.7%']] }
};
function paintStats(k) {
  const R = RANGES[k], v = R.s;
  stats('#stats', [
    { label:'Total Customers', icon:'users', tone:'', count:v[0][1], delta:v[0][2], note:R.note },
    { label:'Active Leads', icon:'userplus', tone:'green', count:v[1][1], delta:v[1][2], note:R.note },
    { label:'Revenue', icon:'dollar', tone:'amber', count:v[2][1], prefix:'$', suffix:'M', decimals:v[2][1] < 1 ? 2 : 1, delta:v[2][2], note:R.note },
    { label:'Open Deals', icon:'pr', tone:'', count:v[3][1], delta:v[3][2], dir:'down', note:R.note },
    { label:'Tasks Due Today', icon:'check', tone:'purple', count:v[4][1], delta:v[4][2], dir:'flat', note:R.note },
    { label:'Projects Active', icon:'folder', tone:'green', count:v[5][1], delta:v[5][2], note:R.note }
  ], true);
}
paintStats(30);
$('#range').addEventListener('change', e => paintStats(e.target.value));
$('#exportBtn').addEventListener('click', async e => {
  const b = e.currentTarget; await E.busy(b, 800);
  E.download('empowa360-dashboard-summary.csv', E.csv([['Metric','Value','Change'],['Total Customers','2,847','+12.4%'],['Active Leads','342','+8.2%'],['Revenue','$1.2M','+15.3%'],['Open Deals','67','-2.1%'],['Tasks Due Today','12','0.0%'],['Projects Active','8','+4.3%']]));
  E.toast('Report exported as CSV', 'ok');
});

/* charts */
chart('#growth', c => ({ type:'bar',
  data:{ labels:['May','Jun','Jul','Aug','Sep','Oct'], datasets:[{ data:[65,84,98,112,135,155], backgroundColor:c.primary, borderRadius:6, maxBarThickness:40 }] },
  options:{ responsive:true, maintainAspectRatio:false, layout:{ padding:{ top:24 } }, plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:x => ` ${x.parsed.y} new customers` } } },
    scales:{ x:{ grid:{ display:false }, border:{ display:false } }, y:{ display:false, beginAtZero:true } } },
  plugins:[{ id:'vals', afterDatasetsDraw(ch) { const { ctx } = ch; ctx.save(); ctx.fillStyle = c.text; ctx.font = '600 12px Inter, sans-serif'; ctx.textAlign = 'center'; ch.getDatasetMeta(0).data.forEach((b, i) => ctx.fillText(ch.data.datasets[0].data[i], b.x, b.y - 8)); ctx.restore(); } }]
}));
const revChart = chart('#rev', c => ({ type:'line',
  data:{ labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], datasets:[
    { label:'Current Year', data:[42,48,45,60,56,72,84,78,92,103,98,118], borderColor:c.primary, backgroundColor:c.primary, pointRadius:3, pointHoverRadius:6, borderWidth:2.5, tension:.25 },
    { label:'Previous Year', data:[36,40,44,41,50,53,58,61,66,70,74,82], borderColor:c.gray, backgroundColor:c.gray, pointRadius:0, pointHoverRadius:5, borderWidth:2, borderDash:[5,5], tension:.25 } ] },
  options:{ responsive:true, maintainAspectRatio:false, interaction:{ mode:'index', intersect:false }, plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:x => ` ${x.dataset.label}: $${x.parsed.y}k` } } },
    scales:{ x:{ grid:{ display:false }, border:{ display:false } }, y:{ grid:{ color:c.grid }, border:{ display:false }, ticks:{ callback:v => '$' + v + 'k' } } } } }));
$('#rlegend').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.i, ch = revChart.inst; const vis = ch.isDatasetVisible(i); ch.setDatasetVisibility(i, !vis); b.classList.toggle('off', vis); ch.update(); });

/* upcoming tasks */
const dueLabel = n => n === 0 ? 'Due Today' : n === 1 ? 'Due Tomorrow' : 'Due ' + E.addDays(n).toLocaleDateString('en-US', { month:'short', day:'numeric' });
const UT = [['High','Finalize contract negotiation',0,'In Progress','blue'],['Medium','Send design system overview',1,'Pending','amber'],['Low','Draft follow-up email sequence',5,'Not Started','gray'],['Medium','Update HubSpot field mapping',6,'In Review','purple']];
const PR = { High:'red', Medium:'amber', Low:'green' };
$('#tasks').innerHTML = UT.map((t, i) => `<div class="task-item"><input class="check" type="checkbox" id="ut${i}" aria-label="Mark complete: ${esc(t[1])}" style="margin-top:4px"><div class="t-main"><div class="t-top"><span class="pill ${PR[t[0]]}">${t[0]}</span><span class="t-due">${dueLabel(t[2])}</span></div><div class="t-title">${esc(t[1])}</div><span class="pill ${t[4]}">${t[3]}</span></div></div>`).join('');
$('#tasks').addEventListener('change', e => { const it = e.target.closest('.task-item'); if (!it) return; it.classList.toggle('done', e.target.checked); it.style.opacity = e.target.checked ? .6 : 1; if (e.target.checked) E.toast('Task marked complete', 'ok'); });

/* quick actions (shared forms, saved to the demo store) */
const Q = [['Add Customer','userplus','customer'],['Create Lead','pluscircle','lead'],['New Project','folderp','project'],['Send Invoice','filep','invoice']];
$('#quick').innerHTML = Q.map(q => `<button class="btn btn-primary" data-f="${q[2]}" style="height:48px">${icon(q[1], 18)}${q[0]}</button>`).join('');
$('#quick').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) F[b.dataset.f](); });

</script>
</body>
</html>
